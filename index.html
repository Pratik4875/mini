<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pratik's Foodie Cafe</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #fff8ee; color: #222; text-align: center; }
    header { background: #2c1e16; color: #fff; padding: 14px; }
    header a { color: #ffd27d; margin: 0 12px; text-decoration: none; font-weight: bold; }
    .hero { background: #ffd27d; padding: 36px 20px; }
    .menu { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 30px 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; width: 200px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h3 { color: #d9480f; margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <a href="#">Home</a>
    <a href="#menu">Menu</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </header>
  <div class="hero">
    <h1>Pratik's Foodie Cafe</h1>
    <p>Delicious food served fresh — containerized with Docker!</p>
  </div>
  <h2 id="menu">Our Menu</h2>
  <div class="menu">
    <div class="card">
      <h3>Pizza</h3>
      <p>Cheesy &amp; delicious pizza</p>
      <strong>Rs. 199</strong>
    </div>
    <div class="card">
      <h3>Burger</h3>
      <p>Fresh &amp; tasty burger</p>
      <strong>Rs. 149</strong>
    </div>
    <div class="card">
      <h3>Pasta</h3>
      <p>Creamy Italian pasta</p>
      <strong>Rs. 179</strong>
    </div>
  </div>
</body>
</html>
